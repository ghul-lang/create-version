# A required-status-check "merge gate". Make this check required in branch
# protection for your default branch. It passes immediately for a patch PR
# (no label), so patch PRs auto-merge untouched; it fails for a PR labelled
# `minor`/`major` until the named approver has an approving review, so those
# cannot merge — even with auto-merge enabled — without a deliberate approval.
#
# GitHub has no native way to require approval conditionally on a label, so the
# policy lives in this check. It re-runs on review events, so the moment the
# approval lands it flips green and unblocks the merge.

name: Version bump approval

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  approval:
    name: Version bump approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require approval for a minor/major bump
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        APPROVER: degory
        MAJOR_LABEL: major
        MINOR_LABEL: minor
      run: |
        set -euo pipefail

        labels="$(gh api "repos/${REPO}/issues/${PR}/labels" --jq '.[].name' || true)"
        bump=""
        if   grep -qxF "$MAJOR_LABEL" <<< "$labels"; then bump="major"
        elif grep -qxF "$MINOR_LABEL" <<< "$labels"; then bump="minor"
        fi

        if [ -z "$bump" ]; then
          echo "No ${MAJOR_LABEL}/${MINOR_LABEL} label — patch bump, no approval required."
          exit 0
        fi

        # Effective review state from the approver: the most recent APPROVED /
        # CHANGES_REQUESTED / DISMISSED review (COMMENTED never changes it),
        # mirroring GitHub's own review-state logic.
        state="$(gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
          --jq "[.[] | select(.user.login == \"${APPROVER}\")
                     | select(.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\" or .state == \"DISMISSED\")]
                 | last | .state // \"\"")"

        if [ "$state" = "APPROVED" ]; then
          echo "${bump} bump approved by ${APPROVER}."
          exit 0
        fi

        echo "::error::This PR is labelled '${bump}', which bumps the ${bump} version. It needs an approving review from ${APPROVER} before it can merge."
        exit 1
