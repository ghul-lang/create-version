name: Create version number
description: >-
  Compute the next semantic version from the latest Git tag, with the bump
  level (major / minor / patch) driven by a label on the associated pull
  request. Pure computation — it never creates a tag or release.

inputs:
  token:
    description: GitHub token, used to read pull-request labels.
    required: true
  version:
    description: >-
      Explicit version override (e.g. 1.4.0 or v1.4.0). Used verbatim when set,
      bypassing tag lookup and the label/bump logic.
    required: false
    default: ''
  bump:
    description: >-
      Explicit bump level (major | minor | patch). Skips the PR-label lookup
      when set. Useful for callers that decide the bump themselves.
    required: false
    default: ''
  default-bump:
    description: Bump level applied when no major/minor label is present.
    required: false
    default: patch
  prerelease:
    description: >-
      Optional prerelease suffix, appended as -<prerelease> (e.g.
      beta.${{ github.run_number }}). Use for non-release builds so they can
      never collide with a real release.
    required: false
    default: ''
  tag-prefix:
    description: Tag prefix.
    required: false
    default: v
  major-label:
    description: PR label that selects a major bump.
    required: false
    default: major
  minor-label:
    description: PR label that selects a minor bump.
    required: false
    default: minor

outputs:
  tag:
    description: Version tag, e.g. v1.4.0
    value: ${{ steps.compute.outputs.tag }}
  package:
    description: Version number without the prefix, e.g. 1.4.0
    value: ${{ steps.compute.outputs.package }}
  bump:
    description: The bump level applied (major | minor | patch | manual)
    value: ${{ steps.compute.outputs.bump }}
  previous-tag:
    description: The tag the version was computed from (empty before the first release)
    value: ${{ steps.compute.outputs.previous-tag }}

runs:
  using: composite
  steps:
  - name: Compute version
    id: compute
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.token }}
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_BUMP: ${{ inputs.bump }}
      INPUT_DEFAULT_BUMP: ${{ inputs.default-bump }}
      INPUT_PRERELEASE: ${{ inputs.prerelease }}
      INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
      INPUT_MAJOR_LABEL: ${{ inputs.major-label }}
      INPUT_MINOR_LABEL: ${{ inputs.minor-label }}
    run: bash "${GITHUB_ACTION_PATH}/compute-version.sh"
