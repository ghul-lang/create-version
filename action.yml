name: Create version number
description: >-
  Compute the next semantic version from the latest Git tag and a checked-in
  VERSION floor file. Patches come from the tag; a minor/major release is cut
  by raising the (code-owned) VERSION file in a PR. Pure computation — no tags,
  no GitHub API, no token.

inputs:
  version:
    description: >-
      Explicit version override (e.g. 1.4.0 or v1.4.0). Used verbatim when set,
      bypassing the tag lookup and the VERSION floor.
    required: false
    default: ''
  version-file:
    description: >-
      Path to the VERSION floor file. When it holds a strict X.Y.Z that is
      higher than the tag-derived patch bump, that version is used — this is
      how a minor/major release is declared. Missing or non-semver content is
      ignored (patch bump from the tag).
    required: false
    default: VERSION
  prerelease:
    description: >-
      Optional prerelease suffix, appended as -<prerelease> (e.g. a build
      number). Use for non-release builds so they can never collide with a
      real release.
    required: false
    default: ''
  tag-prefix:
    description: Tag prefix.
    required: false
    default: v

outputs:
  tag:
    description: Version tag, e.g. v1.4.0
    value: ${{ steps.compute.outputs.tag }}
  package:
    description: Version number without the prefix, e.g. 1.4.0
    value: ${{ steps.compute.outputs.package }}
  bump:
    description: The bump level relative to the previous release (major | minor | patch | manual)
    value: ${{ steps.compute.outputs.bump }}
  previous-tag:
    description: The tag the version was computed from (empty before the first release)
    value: ${{ steps.compute.outputs.previous-tag }}

runs:
  using: composite
  steps:
  - name: Compute version
    id: compute
    shell: bash
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_VERSION_FILE: ${{ inputs.version-file }}
      INPUT_PRERELEASE: ${{ inputs.prerelease }}
      INPUT_TAG_PREFIX: ${{ inputs.tag-prefix }}
    run: bash "${GITHUB_ACTION_PATH}/compute-version.sh"
